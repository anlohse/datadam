# The unit tests under ThreadSanitizer, with every dependency built with it
# too (triplets/x64-linux-tsan): the Dockerfile's tsan stage. The first run
# builds the instrumented dependencies (over an hour on a hosted runner); they
# are cached afterwards. By hand, and once a week.
name: ThreadSanitizer

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  tsan:
    name: Unit tests under TSan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The instrumented dependencies alone first, so their cache is saved even
      # when the tests then report races.
      - name: Dependencies built with ThreadSanitizer
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tsan-deps
          build-args: BUILD_JOBS=4
          cache-from: type=gha,scope=tsan-deps
          cache-to: type=gha,scope=tsan-deps,mode=max

      - name: Unit tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tsan
          build-args: BUILD_JOBS=4
          cache-from: type=gha,scope=tsan-deps
