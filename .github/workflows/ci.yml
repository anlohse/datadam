# Builds and tests datadam on Linux (in Docker, as the Dockerfile does) and on
# Windows (MSVC). The vcpkg dependencies are cached: the first run builds them
# (RocksDB takes a while), later runs reuse them until vcpkg.json or vcpkg-ports/
# changes.
# A push to main whose Linux tests all pass publishes the image to
# ghcr.io/<owner>/datadam, tagged edge and sha-<commit>; releases (release.yml)
# publish <version>, <major>.<minor> and latest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The manifest's builtin-baseline (vcpkg.json) and the Dockerfile's VCPKG_COMMIT.
  VCPKG_COMMIT: 77df67cfff9c12ccfdb52284e07c87c75092f723

jobs:
  linux:
    name: Linux (GCC 13, Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write  # the image, to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # The dependency layer alone first, so its cache is saved even when a
      # later step fails.
      - name: Dependencies (vcpkg)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: deps
          build-args: BUILD_JOBS=4
          cache-from: type=gha,scope=linux-deps
          cache-to: type=gha,scope=linux-deps,mode=max

      - name: Build, unit tests and integration test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: test
          build-args: |
            BUILD_JOBS=4
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=linux-deps

      - name: Runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          build-args: |
            BUILD_JOBS=4
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=linux-deps
          tags: datadam:latest
          load: true

      # Known vulnerabilities in the image's packages that have a fix. Pinned to
      # a commit: the action's tags were rewritten in a supply-chain attack (2026).
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: datadam:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: redis-cli suite (commands, persistence, TLS, replication)
        run: bash tests/docker_redis_cli.sh datadam:latest

      - name: Redis Sentinel failover
        run: bash tests/docker_sentinel_test.sh

      # The cloud test's crash and failover phases, short: each check is a bug they found.
      - name: Crashes and failover under writes
        run: bash tests/docker_fault_test.sh

      # Only an image that passed everything above, and only from main.
      - name: Image tags
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge
            type=sha,format=short

      - name: Log in to ghcr.io
        if: steps.meta.outcome == 'success'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        if: steps.meta.outcome == 'success'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          build-args: |
            BUILD_JOBS=4
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=linux-deps
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true

  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # The Dockerfile's asan stage: unit and integration tests built with
      # AddressSanitizer (leaks included; the memory pool poisons what it does
      # not hand out) and UndefinedBehaviorSanitizer. The first report fails it.
      - name: Unit and integration tests under the sanitizers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: asan
          build-args: BUILD_JOBS=4
          cache-from: type=gha,scope=linux-deps

  fuzz:
    name: Fuzzing (libFuzzer, 1 min per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build the fuzz targets (Clang, ASan + UBSan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          target: fuzz
          build-args: BUILD_JOBS=4
          cache-from: type=gha,scope=linux-deps
          tags: datadam:fuzz
          load: true

      - name: Fuzz every target
        run: bash fuzz/run.sh 60

      - name: Keep what the fuzzers found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      VCPKG_ROOT: C:\dd\vcpkg
      VCPKG_DISABLE_METRICS: 1
      VCPKG_BINARY_SOURCES: clear;files,C:\dd\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: vcpkg at the manifest's baseline
        shell: pwsh
        run: |
          git init -q $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg.git
          git -C $env:VCPKG_ROOT fetch -q --depth 1 origin $env:VCPKG_COMMIT
          git -C $env:VCPKG_ROOT checkout -q FETCH_HEAD
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "C:\dd\vcpkg-cache" | Out-Null
          # vcpkg's package hashes include the compiler's, which changes with
          # the runner image: one cache per image version.
          "DEPS_KEY=vcpkg-windows-$env:ImageVersion-$env:VCPKG_COMMIT" | Out-File -Append $env:GITHUB_ENV

      - name: Restore built dependencies
        id: deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: C:\dd\vcpkg-cache
          key: ${{ env.DEPS_KEY }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: ${{ env.DEPS_KEY }}-

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: x64

      # Release-only dependencies: CI builds the Release configuration only.
      - name: Configure (installs the dependencies)
        run: cmake --preset windows -DVCPKG_TARGET_TRIPLET=x64-windows-release

      # Saved right after the install, so a failing build or test does not
      # throw the built dependencies away.
      - name: Save built dependencies
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: C:\dd\vcpkg-cache
          key: ${{ env.DEPS_KEY }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}

      - name: Build
        run: cmake --build --preset windows-release

      - name: Unit tests
        run: ctest --preset windows-release
