# datadam configuration. Every option can also be given on the command line
# as --option value, which overrides this file.

# ---- network ----
bind 0.0.0.0
# Protected mode (as in Redis): while the default user has no password
# (requirepass), only clients on the loopback interface may connect; others are
# refused with an error. Set a password, or turn this off only where the ports
# are not reachable from untrusted networks (the Docker image turns it off).
protected-mode yes
port 6379
# memcache text protocol; 0 disables
memcache-port 11211
# auto: one per CPU up to 8, then half the CPUs
io-threads auto
# Threads that load keys missing from the cache for plain reads (GET, MGET,
# EXISTS...) while the I/O threads keep serving other clients. A key wanted by
# several clients at once is read from disk once. 0: the I/O thread reads it.
read-threads 64
# When keys queue up for the read threads, each one may take up to this many
# and read them with one RocksDB MultiGet. That saves CPU but reads different
# files one after another; on random keys it measured no faster than 1.
read-batch 1
# Linux: a read whose blocks are in the OS page cache is served at once, on the
# I/O thread; only one that must wait for the disk goes to the read threads.
page-cache-reads yes

# ---- persistence (RocksDB) ----
dir ./data
# always   - fsync on every write (safest, slowest)
# everysec - fsync the WAL once per second (lose at most ~1s on power loss)
# no       - let the OS decide
fsync everysec
# Group commit: the writes of all requests read together from one connection
# (a pipeline) go to RocksDB as one batch, before any of their replies is sent.
write-batching yes
# EXPERIMENTAL, for benchmarks only: wal (default, safe) | wal-buffered (WAL written
# once per second; a crash loses up to ~1s) | no-wal | memory (nothing reaches disk).
# experimental-write-path wal
rocksdb-block-cache 64mb
rocksdb-write-buffer 64mb
rocksdb-background-jobs 4

# ---- change feed (CDC.READ) ----
# How long to keep WAL files after RocksDB no longer needs them, so CDC.READ
# can read the changes in them. 0 (the default) turns the feed off. Needs
# experimental-write-path wal or wal-buffered. Kept WAL is as large as what is
# written, so wal-retention-size caps it (checked every second; the oldest
# files go first).
wal-retention 0
wal-retention-size 1gb
# A primary keeps up to this much more while a connected replica still needs
# it (a long full sync under heavy writes).
wal-retention-hold 8gb

# ---- object cache / memory pool ----
# Hard ceiling of the pool. 0 disables the cache (every read goes to RocksDB).
cache-max-memory 512mb
# Idle eviction never shrinks the cache below this; pool pages up to this size
# stay committed for reuse instead of going back to the OS.
cache-min-memory 64mb
# Objects (key + value) up to this size live in the pool; larger ones are
# always read from disk. Between 64b and 1mb.
cache-max-object-size 4kb
# Release items not read for this long (0 = never).
cache-max-idle 5m
# Release items this long after they were loaded, even if hot (0 = never).
cache-max-age 0
cache-maintenance-interval 1s
cache-shards 16
# Writes populate the cache (write-through). With "no", only reads do.
cache-on-write yes
# Admission filter: once the pool is full, a key that is not cached gets in
# only on its second access within a short window, so keys read or written
# once (a bulk load, a scan, the long tail of a data set larger than the
# pool) do not push out the hot ones. With "no", every access is cached.
cache-admission yes

log-level info

# ---- replication ----
# Follow a primary as a read-only replica: "replicaof <host> <port>". The
# primary needs wal-retention (long enough to cover a full sync). REPLICAOF
# changes it at run time; REPLICAOF NO ONE promotes the replica.
# replicaof 10.0.0.1 6379
# User and password to log in to the primary with (if it asks for one).
# masteruser replicator
# masterauth change-me

# ---- security ----
# When set, Redis clients must AUTH <password> (or HELLO ... AUTH default <password>)
# before any other command, and memcache clients must first send "auth <password>"
# (the memcache text protocol has no authentication of its own). Set it whenever the
# server is reachable from other machines.
# requirepass change-me

# ACL users, Redis-style: "user <name> <rules...>" defines the user from scratch.
# (ACL SETUSER changes users at runtime; CONFIG REWRITE writes them back here.)
# user app on >app-password ~app:* +@read +@write -@dangerous
# user reports on >reports-password %R~* +@read -@dangerous
# Entries kept by ACL LOG (refused commands and keys, failed logins).
acllog-max-len 128

# ---- TLS (Redis protocol) ----
# A TLS port next to the plain one; "port 0" leaves only TLS.
# tls-port 6380
# tls-cert-file /etc/datadam/server.crt
# tls-key-file /etc/datadam/server.key
# CAs that sign client certificates (needed unless tls-auth-clients no).
# tls-ca-cert-file /etc/datadam/ca.crt
# yes: clients must present a certificate signed by those CAs; optional; no
# tls-auth-clients yes
# cn: a valid client certificate logs in as the ACL user named by its CN (no password)
# tls-auth-clients-user off
# tls-protocols TLSv1.2,TLSv1.3
# Certificates can be replaced without a restart: CONFIG SET tls-cert-file <same or new path>
